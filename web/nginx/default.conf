# =============================================================================
# Nginx del frontend
# -----------------------------------------------------------------------------
#   /            Aplicación React (SPA). Toda ruta desconocida devuelve
#                index.html para que el enrutador del navegador la resuelva
#                (así /creditos/12 funciona al recargar o compartir el enlace).
#   /api/, /health  Proxy hacia la API: el navegador ve un solo origen.
#   /salud-web   Healthcheck del propio contenedor (no consulta la API).
# =============================================================================

# Cabecera Connection correcta según el cliente pida o no "upgrade".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # No publicar la versión de Nginx en errores ni cabeceras.
    server_tokens off;

    # Un crédito pesa menos de 1 KB; la API también limita a 100 KB.
    client_max_body_size 100k;

    # DNS interno de Docker, consultado de nuevo cada 30 s.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream http://api:3000;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---------------------------------------------------------------- API ----
    # Sin cabeceras de seguridad propias: las define la API (Helmet), y la
    # documentación Swagger necesita una política distinta a la de la SPA.
    location /api/ {
        # Con variable, Nginx resuelve el nombre en cada petición (ver resolver).
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass $api_upstream;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /salud-web {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ----------------------------------------------------------- Frontend ----
    # Los archivos de /assets llevan un hash en el nombre (index-Bdw_aVDe.js):
    # si cambian, cambia el nombre. Por eso se guardan en caché un año.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html nunca se guarda en caché: así cada despliegue llega al
    # instante y apunta a los nuevos archivos con hash.
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
